<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Reconnct — curated experiences to reconnect with friends, family, your partner, kids and yourself. Discover, book and manage experiences near you." />
    <meta name="theme-color" content="#FFB900" />
    <!-- Installed-app (PWA) metadata — iOS reads these instead of the manifest -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reconnct" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Reconnct" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reconnct" />
    <meta property="og:title" content="Reconnct — experiences that connect" />
    <meta property="og:description" content="Curated experiences for every relationship. Discover and book experiences near you." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1200&q=80" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Image CDNs + API used on the first screen -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://reconnct-again-backend.onrender.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Great+Vibes&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <title>Reconnct — experiences that connect</title>
    <script>
      /* The Reconnct app is Android-only. Other devices (iPhone, desktop) use
         the website: drop the install manifest there so no "Install app" /
         "Add to Home Screen" app mode is offered. Runs before any install
         check. The Play Store TWA is Android, so it keeps the manifest. */
      (function () {
        if (/Android/i.test(navigator.userAgent)) return;
        var remove = function () {
          var l = document.querySelector('link[rel="manifest"]');
          if (l) l.parentNode.removeChild(l);
        };
        remove();
        document.addEventListener('DOMContentLoaded', remove);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
