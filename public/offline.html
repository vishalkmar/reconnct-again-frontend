<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFB900" />
  <title>You’re offline · Reconnct</title>
  <!-- Static offline page: used as the TWA fallback and for direct visits when
       the app shell itself is not cached yet. No external assets. -->
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F3F4F6; color: #1F2937; }
    .card { width: 100%; max-width: 360px; background: #fff; border-radius: 24px; padding: 32px 24px;
      text-align: center; box-shadow: 0 14px 40px -14px rgba(16,24,40,.18); }
    .badge { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto; display: grid; place-items: center;
      background: linear-gradient(160deg, #FFC629, #F9B402); }
    h1 { font-size: 20px; margin: 20px 0 6px; color: #1A1A2E; }
    p { margin: 0; color: #6B7280; font-size: 14px; line-height: 1.5; }
    button { margin-top: 24px; width: 100%; height: 48px; border: 0; border-radius: 999px;
      background: #FFB900; color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2.55-1.83"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><circle cx="12" cy="20" r="1"/></svg>
    </div>
    <h1>You’re offline</h1>
    <p>Check your internet connection. Your bookings are safe — we’ll pick up right where you left off.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
